name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22 matches the Dockerfile base image, so CI tests what ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Runs against a fresh auto-seeded DB — no data/wayfarer.db in the repo.
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build-only: catches container-only breakage (e.g. edge-bundle module errors).
      - name: Build image
        run: docker build -t wayfarer:ci .
